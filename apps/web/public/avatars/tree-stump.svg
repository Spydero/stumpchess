<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- soft ground -->
  <rect width="128" height="128" fill="#e7e0d4"/>
  <ellipse cx="64" cy="112" rx="46" ry="8" fill="#c9bfa8" opacity="0.55"/>

  <!-- stump body (bark cylinder) -->
  <path
    d="M34 58
       C34 52 38 48 44 46
       L48 92
       C42 94 36 90 34 82
       Z"
    fill="#5a3d22"
  />
  <path
    d="M94 58
       C94 52 90 48 84 46
       L80 92
       C86 94 92 90 94 82
       Z"
    fill="#5a3d22"
  />
  <path
    d="M40 48
       C40 44 48 42 64 42
       C80 42 88 44 88 48
       L84 94
       C84 100 74 104 64 104
       C54 104 44 100 44 94
       Z"
    fill="#6e4a28"
  />
  <!-- bark ridges -->
  <path d="M50 50 C49 62 49 76 50 92" stroke="#4a3218" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M64 48 C63 64 63 80 64 98" stroke="#4a3218" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M78 50 C79 64 79 78 78 92" stroke="#4a3218" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M56 52 C55 68 56 84 57 96" stroke="#8a6236" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M72 52 C73 68 72 84 71 96" stroke="#8a6236" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- jagged broken / sawn top rim -->
  <path
    d="M36 56
       L42 48 L48 54 L54 44 L60 50 L64 40 L68 50 L74 42 L80 52 L86 46 L92 56
       C88 50 76 46 64 46
       C52 46 40 50 36 56 Z"
    fill="#4a3218"
  />

  <!-- cut face (growth rings) -->
  <ellipse cx="64" cy="52" rx="28" ry="12" fill="#c9a46a"/>
  <ellipse cx="64" cy="52" rx="22" ry="9" fill="none" stroke="#8b6914" stroke-width="1.6"/>
  <ellipse cx="64" cy="52" rx="15" ry="6" fill="none" stroke="#a67c2d" stroke-width="1.4"/>
  <ellipse cx="64" cy="52" rx="8" ry="3.2" fill="none" stroke="#6b4f2a" stroke-width="1.3"/>
  <ellipse cx="64" cy="52" rx="3" ry="1.3" fill="#5a3d22"/>

  <!-- crack across the top (broken look) -->
  <path
    d="M50 50 L58 53 L64 49 L72 54 L78 51"
    stroke="#5a3d22"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />

  <!-- splinter / broken shard on the left -->
  <path
    d="M40 50 L34 38 L44 46 Z"
    fill="#8b6914"
    stroke="#4a3218"
    stroke-width="1"
  />
  <path
    d="M88 49 L96 36 L84 46 Z"
    fill="#a67c2d"
    stroke="#4a3218"
    stroke-width="1"
  />

  <!-- roots -->
  <path
    d="M46 100 C38 106 28 110 22 112"
    stroke="#5a3d22"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path
    d="M56 102 C52 110 44 116 36 118"
    stroke="#6e4a28"
    stroke-width="4"
    stroke-linecap="round"
  />
  <path
    d="M72 102 C76 110 84 116 92 118"
    stroke="#6e4a28"
    stroke-width="4"
    stroke-linecap="round"
  />
  <path
    d="M82 100 C90 106 100 110 106 112"
    stroke="#5a3d22"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
